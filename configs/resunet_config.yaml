# ResNet-UNet baseline configuration

_base_: base_config.yaml

experiment:
  name: "baseline_resunet"
  description: "ResNet34-based UNet with pretrained encoder - baseline model"

model:
  name: "ResUNet"
  architecture: "resnet_unet"
  
  # Encoder settings
  encoder:
    backbone: "resnet34"
    pretrained: true
    in_channels: 1
    # ResNet34 feature channels: [64, 64, 128, 256, 512]
    
  # Decoder settings
  decoder:
    channels: [512, 256, 128, 64, 32]
    use_residual: true
    dropout: 0.2
    
  # Output settings
  output:
    out_channels: 1
    activation: null

training:
  batch_size: 16
  epochs: 50
  
  optimizer:
    type: "adam"
    learning_rate: 0.0003  # Slightly higher LR for pretrained models
    weight_decay: 0.0001
    
  scheduler:
    type: "cosine"
    warmup_epochs: 3

loss:
  type: "combined"
  dice_weight: 0.7
  bce_weight: 0.3
